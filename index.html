<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>NRJ Graphics</title><style>body{margin:0;font:16px Arial;background:#f6f6f3;color:#171717}.nav{padding:18px 6%;background:#fff;display:flex;justify-content:space-between;position:sticky;top:0}.logo{font-weight:900;font-size:22px}.mark{background:#ffd21a;padding:8px;border-radius:8px}.hero{padding:70px 6%;background:linear-gradient(135deg,#fff,#ffe36b)}h1{font-size:55px;max-width:750px;margin:15px 0}p{color:#666;line-height:1.6}.btn{padding:13px 18px;border:0;border-radius:9px;font-weight:800;background:#171717;color:#fff}.yellow{background:#ffd21a;color:#111}.section{padding:55px 6%}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:#fff;border:1px solid #ddd;border-radius:15px;padding:18px}.icon{height:90px;background:#f3efd5;border-radius:10px;display:grid;place-items:center;font-size:38px}.order{background:#171717;color:#fff}.box{max-width:850px;background:#222;padding:25px;border-radius:18px}.field{margin:12px 0}.field label{display:block;font-size:12px;margin-bottom:5px;color:#bbb}.field input,.field select{width:100%;padding:12px;border-radius:8px;border:1px solid #555;box-sizing:border-box}.price{font-size:30px;font-weight:900;margin:20px 0;color:#ffd21a}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}h1{font-size:40px}}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style><div class="nav"><div class="logo"><span class="mark">N</span> NRJ Graphics</div><button class="btn" onclick="go()">Start Order</button></div><section class="hero"><small>B2B PRINTING • INDIA</small><h1>Your print partner, without the machinery.</h1><p>Wholesale printing for designers, agencies and businesses. Choose a product, customize it and get an indicative quote.</p><button class="btn" onclick="go()">Create an Order →</button></section><section class="section"><h2>Popular Products</h2><div class="grid" id="products"></div></section><section class="section order" id="order"><h2>Create your print order</h2><div class="box"><div class="field"><label>PRODUCT</label><select id="p" onchange="calc()"></select></div><div class="field"><label>QUANTITY</label><input id="q" type="number" value="500" min="1" oninput="calc()"></div><div class="field"><label>MATERIAL</label><select id="m" onchange="calc()"><option>Standard</option><option>Premium</option><option>300 GSM</option><option>Vinyl</option><option>PVC</option></select></div><div class="field"><label>FINISHING</label><select id="f" onchange="calc()"><option>None</option><option>Matt Lamination</option><option>Gloss Lamination</option><option>Die Cut</option><option>Embossing</option></select></div><div class="field"><label>YOUR NAME / BUSINESS</label><input id="n" placeholder="Name or business"></div><div class="price" id="price">₹0</div><button class="btn yellow" onclick="wa()">Request Quote on WhatsApp →</button></div></section><footer class="section">© 2026 NRJ Graphics</footer><script>const data=[['Visiting Cards','▦',699],['Flyers & Pamphlets','▤',450],['Stickers & Labels','◈',500],['Brochures','▱',900],['Letterheads','▥',550],['Posters','▰',650],['Packaging','▰',1200],['Custom Printing','✦',0]];let p=document.getElementById('p');data.forEach((x,i)=>{products.innerHTML+=`<div class="card"><div class="icon">${x[1]}</div><h3>${x[0]}</h3><p>Professional B2B printing</p><b>${x[2]?'From ₹'+x[2]+'/500':'Custom Quote'}</b><br><button class="btn yellow" style="margin-top:12px" onclick="p.value=${i};go();calc()">Customize</button></div>`;p.innerHTML+=`<option value="${i}">${x[0]}</option>`});function calc(){let x=data[+p.value],v=x[2],q=+document.getElementById('q').value||1;if(v)v*=q/500;let m=document.getElementById('m').value,f=document.getElementById('f').value;if(m==='Premium')v*=1.18;if(m==='300 GSM')v*=1.15;if(m==='Vinyl')v*=1.45;if(m==='PVC')v*=1.6;if(f.includes('Lamination'))v*=1.12;if(f==='Die Cut')v*=1.2;if(f==='Embossing')v*=1.35;price.textContent=v?'₹'+Math.round(v):'Custom Quote'}function go(){document.getElementById('order').scrollIntoView({behavior:'smooth'})}function wa(){let x=data[+p.value],msg='Hi NRJ Graphics, I need a quote.%0AProduct: '+x[0]+'%0AQuantity: '+q.value+'%0AMaterial: '+m.value+'%0AFinishing: '+f.value+'%0AName: '+n.value+'%0AEstimate: '+price.textContent;window.open('https://wa.me/?text='+msg,'_blank')}calc();</script>
