<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NRJ Graphics — Private Dashboard</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#0a0c0d;color:#fff;font-family:Inter,system-ui,Arial,sans-serif}button,input,select{font:inherit}.wrap{width:min(1180px,94vw);margin:auto}.top{padding:28px 0 20px;border-bottom:1px solid #ffffff12;display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-weight:1000;font-size:22px}.muted{color:#929a9f}.login{min-height:100vh;display:grid;place-items:center}.box{width:min(430px,92vw);background:#111416;border:1px solid #ffffff14;border-radius:22px;padding:28px;box-shadow:0 25px 70px #0008}.box h1{margin:0 0 8px}.label{display:block;color:#cbd0d3;font-size:13px;font-weight:700;margin:16px 0 7px}.input{width:100%;background:#0a0c0d;border:1px solid #303437;color:#fff;border-radius:10px;padding:13px}.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:900;cursor:pointer}.primary{background:#ffd21a;color:#111}.dark{background:#181b1d;color:#fff;border:1px solid #ffffff14}.error{color:#ff8f8f;font-size:13px;margin-top:12px}.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.stat{background:#111416;border:1px solid #ffffff12;border-radius:16px;padding:18px}.stat b{font-size:26px;display:block}.toolbar{display:flex;gap:10px;margin-bottom:14px}.toolbar .input{flex:1}.tableWrap{overflow:auto;border:1px solid #ffffff12;border-radius:16px}.table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{padding:13px;border-bottom:1px solid #ffffff0d;text-align:left;font-size:13px}.table th{color:#9ea7ac;background:#111416}.status{background:#171a1c;border:1px solid #303437;color:#fff;border-radius:8px;padding:7px}.wa{color:#7dffad;text-decoration:none;font-weight:800}.empty{padding:30px;text-align:center;color:#929a9f}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}.toolbar{flex-direction:column}}</style></head><body>
<div id="loginView" class="login"><div class="box"><div class="brand">NRJ Graphics</div><p class="muted">Private business dashboard</p><label class="label">Admin Email</label><input id="email" class="input" type="email" autocomplete="username" placeholder="Admin email"><label class="label">Password</label><input id="password" class="input" type="password" autocomplete="current-password" placeholder="Password"><button class="btn primary" style="width:100%;margin-top:18px" onclick="login()">Sign In →</button><div id="loginError" class="error"></div><p class="muted" style="font-size:12px;line-height:1.5;margin-top:18px">Admin accounts are managed through Supabase Auth. There is no public dashboard signup here.</p></div></div>
<div id="app" class="hidden"><div class="wrap"><div class="top"><div><div class="brand">NRJ Graphics Dashboard</div><div class="muted">Private enquiries & production tracking</div></div><button class="btn dark" onclick="logout()">Sign Out</button></div><div class="stats"><div class="stat"><span class="muted">Total</span><b id="total">0</b></div><div class="stat"><span class="muted">New</span><b id="newCount">0</b></div><div class="stat"><span class="muted">Production</span><b id="prodCount">0</b></div><div class="stat"><span class="muted">Completed</span><b id="doneCount">0</b></div></div><div class="toolbar"><input id="search" class="input" placeholder="Search enquiry, customer, phone, product..." oninput="render()"><select id="filter" class="input" style="max-width:220px" onchange="render()"><option>All</option><option>New</option><option>Confirmed</option><option>In Production</option><option>Completed</option><option>Cancelled</option></select><button class="btn dark" onclick="load()">Refresh</button></div><div class="tableWrap"><table class="table"><thead><tr><th>Enquiry</th><th>Customer</th><th>Product</th><th>Qty</th><th>Quote</th><th>Status</th><th>Created</th><th>WhatsApp</th></tr></thead><tbody id="rows"></tbody></table></div></div></div>
<script>const URL="https://bjdxaknxhllhbtpckrza.supabase.co",KEY="sb_publishable_ndgujsCl7qR_H_6Kvkk7Qw_deT4FYZk",db=window.supabase.createClient(URL,KEY);let items=[];
async function login(){const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;const err=document.getElementById("loginError");err.textContent="";if(!email||!password){err.textContent="Enter email and password.";return}const {error}=await db.auth.signInWithPassword({email,password});if(error){err.textContent="Sign in failed. Check your credentials.";return}showApp()}
async function logout(){await db.auth.signOut();showLogin()}
function showLogin(){document.getElementById("loginView").classList.remove("hidden");document.getElementById("app").classList.add("hidden")}
async function showApp(){document.getElementById("loginView").classList.add("hidden");document.getElementById("app").classList.remove("hidden");await load()}
async function load(){const {data,error}=await db.from("nrj_enquiries").select("*").order("created_at",{ascending:false});if(error){alert("Dashboard access error: "+error.message);return}items=data||[];updateStats();render()}
function updateStats(){document.getElementById("total").textContent=items.length;document.getElementById("newCount").textContent=items.filter(x=>x.status==="New").length;document.getElementById("prodCount").textContent=items.filter(x=>x.status==="In Production").length;document.getElementById("doneCount").textContent=items.filter(x=>x.status==="Completed").length}
function render(){const q=(document.getElementById("search").value||"").toLowerCase(),f=document.getElementById("filter").value;const rows=items.filter(x=>(f==="All"||x.status===f)&&[x.enquiry_id,x.customer_name,x.phone,x.product,x.quantity].join(" ").toLowerCase().includes(q));document.getElementById("rows").innerHTML=rows.length?rows.map(x=>{const wa="https://wa.me/"+String(x.phone||"").replace(/\D/g,"")+"?text="+encodeURIComponent("Hi "+(x.customer_name||"")+", regarding your NRJ Graphics enquiry "+x.enquiry_id+".");return "<tr><td><b>"+esc(x.enquiry_id)+"</b></td><td>"+esc(x.customer_name)+"<br><span class='muted'>"+esc(x.phone||"")+"</span></td><td>"+esc(x.product)+"</td><td>"+esc(x.quantity||"")+"</td><td>"+(x.estimated_quote?"₹"+Number(x.estimated_quote).toLocaleString("en-IN"):"—")+"</td><td><select class='status' onchange='changeStatus(""+x.id+"",this.value)'>"+["New","Confirmed","In Production","Completed","Cancelled"].map(s=>"<option "+(x.status===s?"selected":"")+">"+s+"</option>").join("")+"</select></td><td>"+new Date(x.created_at).toLocaleString("en-IN")+"</td><td>"+(x.phone?"<a class='wa' target='_blank' href='"+wa+"'>Chat ↗</a>":"—")+"</td></tr>"}).join(""):"<tr><td colspan='8' class='empty'>No enquiries found.</td></tr>"}
async function changeStatus(id,status){const {error}=await db.from("nrj_enquiries").update({status,updated_at:new Date().toISOString()}).eq("id",id);if(error){alert("Could not update status: "+error.message);await load();return}const x=items.find(i=>i.id===id);if(x)x.status=status;updateStats()}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
db.auth.getSession().then(({data})=>data.session?showApp():showLogin());db.auth.onAuthStateChange((event,session)=>{if(event==="SIGNED_OUT")showLogin()});
</script></body></html>
